<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポ・トロクエスト（Map版）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="titleScreen" class="title-screen">
  <div class="title-card">
    <h1>ポ・トロクエスト</h1>
    <p>ご主人様たちをいやして、ポ・トロに平和を取り戻そう！</p>
    <button id="startBtn" class="start-btn">冒険をはじめる</button>
    <div class="version-label">スマホ版 v16 / Map</div>
  </div>
</section>

<main id="mapScreen" class="hidden">
  <section class="map-panel">
    <h2>お屋敷マップ</h2>
    <div id="locationName" class="location-name">玄関ホール</div>

    <div class="map-route">
      <div class="map-step active">玄関</div>
      <div class="map-line"></div>
      <div class="map-step">廊下</div>
      <div class="map-line"></div>
      <div class="map-step">休憩室</div>
      <div class="map-line"></div>
      <div class="map-step">大広間</div>
      <div class="map-line"></div>
      <div class="map-step boss">王の間</div>
    </div>

    <p id="mapMessage">探索してみよう！</p>

    <div class="map-actions">
      <button id="searchBtn">探索する</button>
      <button id="nextBtn">次へ進む</button>
    </div>
  </section>
</main>

<main id="battleScreen" class="hidden">
  <section class="battle-panel">
    <h2 id="enemyName">敵が現れた！</h2>
    <img id="enemyImage" src="img/enemies/teiji.png?v=16" alt="enemy">
    <p id="battleMessage">戦闘開始！</p>

    <div class="battle-actions">
      <button onclick="finishBattle()">勝利する</button>
    </div>
  </section>
</main>

<script src="js/game.js"></script>
</body>
</html>
