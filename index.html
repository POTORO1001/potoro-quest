<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポ・トロクエスト（スマホ版）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="titleScreen" class="title-screen">
  <div class="title-card">
    <h1>ポ・トロクエスト</h1>
    <p>ご主人様たちをいやして、ポ・トロに平和を取り戻そう！</p>
    <button id="startBtn" class="start-btn">冒険をはじめる</button>
  </div>
</section>

<main id="battleScreen" class="battle-screen hidden">
<section class="enemy-panel">
<div class="enemy-header">
<h1 id="enemyName">定時のご主人様</h1>
<div class="hp-bar"><div id="enemyHpFill" class="hp-fill"></div></div>
</div>
<div class="enemy-area">
<img id="enemyImage" src="img/enemies/teiji.png" alt="enemy">
</div>
</section>

<section class="message-panel">
<p id="messageText">敵があらわれた！</p>
</section>

<section class="bottom-ui">
<div class="status-panel">
<h2>まろ Lv.1</h2>
<p id="playerHp">HP 24 / 24</p>
<p id="playerMp">MP 8 / 8</p>
<p id="playerExp">EXP 0 / 20</p>
</div>

<div class="command-panel" id="commandPanel">
<button onclick="playerAction('attack')">たたかう</button>
<button onclick="openSubMenu('magic')">おまじない</button>
<button onclick="playerAction('guard')">ぼうぎょ</button>
<button onclick="openSubMenu('item')">どうぐ</button>
</div>
</section>

<section id="subMenu" class="sub-menu hidden">
  <div class="sub-menu-head">
    <strong id="subMenuTitle">メニュー</strong>
    <button onclick="closeSubMenu()" class="mini-btn">戻る</button>
  </div>
  <div id="subMenuBody" class="sub-menu-body"></div>
</section>

<section id="equipMenu" class="sub-menu hidden">
  <div class="sub-menu-head">
    <strong>装備</strong>
    <button onclick="closeEquipMenu()" class="mini-btn">閉じる</button>
  </div>
  <div id="equipMenuBody" class="sub-menu-body"></div>
</section>


<section id="treasureMenu" class="sub-menu hidden">
  <div class="sub-menu-head">
    <strong>宝箱発見！</strong>
    <button onclick="closeTreasureMenu()" class="mini-btn">閉じる</button>
  </div>
  <div id="treasureMenuBody" class="sub-menu-body"></div>
</section>

<section class="utility-panel">

<button id="equipBtn" class="sub-btn">装備</button>
<button id="soundBtn" class="sub-btn">音: ON</button>
<button id="restartBtn" class="sub-btn">最初から</button>
</section>
</main>

<section id="endingScreen" class="ending-screen hidden">
  <div class="ending-card">
    <h1>ポ・トロに平和が戻った！</h1>
    <p id="endingMessage">ご主人王をいやした！</p>
    <div id="chekiTicket" class="cheki-ticket hidden">
      <div class="ticket-label">SPECIAL DROP</div>
      <h2>チェキ券</h2>
      <p>この画面のスクリーンショットをお屋敷でご提示ください。</p>
    </div>
    <button id="endingRestartBtn" class="start-btn">もう一度あそぶ</button>
  </div>
</section>

<script src="js/game.js"></script>
</body>
</html>
